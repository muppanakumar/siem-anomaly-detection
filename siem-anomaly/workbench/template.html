<title>Outlier Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an analyst's desk. A ranked queue on the left, the selected session opened on the right
   (why it was flagged, where it sits in behaviour space, its event-by-event lifecycle). Nothing is a hero;
   the alert-budget control in the strip is the main instrument. */
:root {
  --bg: #eceff3;          /* cool paper */
  --panel: #fbfcfd;       /* chart / panel surface */
  --panel-2: #f1f4f7;
  --line: #d7dde4;
  --line-2: #e6eaef;
  --ink: #0e1620;
  --ink-2: #3f4b59;
  --ink-3: #5b6876;       /* muted text, 5.3:1 on panel */
  --accent: #2a78d6;
  --accent-2: #1c5cab;    /* accent used as text/links */
  --accent-soft: rgba(42,120,214,.12);
  --crit: #d03b3b;
  --warn: #fab219;
  --warn-ink: #5a3d00;
  --good: #0c7a0c;
  --on-fill: #ffffff;
  --on-warn: #1d1400;
  --dot: rgba(91,104,118,.40);
  --dot-bg: rgba(91,104,118,.13);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --on-s3: #04210f; --on-s4: #261900;
  --shadow: 0 1px 2px rgba(14,22,32,.06);
  --ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0e13; --panel: #12171d; --panel-2: #181f27; --line: #27303a; --line-2: #1e262e;
    --ink: #eef1f4; --ink-2: #b9c2cd; --ink-3: #8b97a5;
    --accent: #3987e5; --accent-2: #6da7ec; --accent-soft: rgba(57,135,229,.2);
    --crit: #e66767; --warn: #fab219; --warn-ink: #fbd88a; --good: #3fcf3f;
    --on-fill: #0e1620; --on-warn: #1d1400;
    --dot: rgba(139,151,165,.5); --dot-bg: rgba(139,151,165,.14);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0e13; --panel: #12171d; --panel-2: #181f27; --line: #27303a; --line-2: #1e262e;
  --ink: #eef1f4; --ink-2: #b9c2cd; --ink-3: #8b97a5;
  --accent: #3987e5; --accent-2: #6da7ec; --accent-soft: rgba(57,135,229,.2);
  --crit: #e66767; --warn: #fab219; --warn-ink: #fbd88a; --good: #3fcf3f;
  --on-fill: #0e1620; --on-warn: #1d1400;
  --dot: rgba(139,151,165,.5); --dot-bg: rgba(139,151,165,.14);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.wrap { max-width: 1480px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-top: 14px; }
.bar { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-bottom: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 { font: 700 22px/1 var(--display); letter-spacing: -.01em; }
.brand span { color: var(--ink-3); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; }
.tabs button { background: none; border: 0; padding: 7px 12px; border-radius: 7px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.tabs button:hover { background: var(--panel-2); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.vsum { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.vsum .it { display: inline-flex; align-items: center; gap: 5px; }
.vsum svg, .vi svg { width: 14px; height: 14px; flex: none; }
.strip { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.strip .win { font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.strip .win b { color: var(--ink); font-weight: 600; }
.budget { display: flex; align-items: center; gap: 10px; flex: 1 1 360px; min-width: 0; }
.budget .rng { position: relative; flex: 1 1 140px; min-width: 120px; padding: 6px 0 14px; }
.budget input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
.budget .tick { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.budget .tick::before { content: ""; position: absolute; left: 50%; top: -9px; height: 7px; width: 1px; background: var(--ink-3); }
.budget output { font-size: 13px; min-width: 150px; }
.budget output b { font-weight: 600; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; color: var(--ink-2); font-size: 12.5px; }
.ghost:hover { background: var(--panel-2); color: var(--ink); }
.ghost.sm { padding: 2px 8px; font-size: 12px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.live { font-size: 12.5px; color: var(--ink-2); }
.live b { color: var(--ink); font-weight: 600; }

main { padding-top: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel > header h2 { font: 600 15px/1.2 var(--display); letter-spacing: -.005em; }
.panel .body { padding: 12px 14px; }
.empty { color: var(--ink-3); padding: 18px 14px; margin: 0; }

/* ---------- triage layout ---------- */
.triage { display: grid; grid-template-columns: minmax(310px, 390px) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.queue { position: sticky; top: 132px; }
.qf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.qf select, .qf input[type=search] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; color: var(--ink); }
.qf .full { grid-column: 1 / -1; }
.qf label.chk { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip button { background: none; border: 0; padding: 0; line-height: 1; color: var(--ink-3); font-size: 14px; }
.chip.gt { background: var(--accent-soft); border-color: transparent; color: var(--accent-2); font-weight: 600; }
.chip.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); border-color: transparent; color: var(--crit); font-weight: 600; }
.qlist { max-height: calc(100vh - 330px); min-height: 360px; overflow-y: auto; }
.row { display: grid; grid-template-columns: 38px 62px minmax(0, 1fr) 20px; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: 8px 12px; }
.row:hover { background: var(--panel-2); }
.row[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .rk { font: 500 11.5px var(--mono); color: var(--ink-3); }
.row .sc { position: relative; height: 22px; display: flex; align-items: center; }
.row .sc i { position: absolute; left: 0; bottom: 2px; height: 3px; border-radius: 2px; background: var(--accent); opacity: .85; }
.row .sc b { font: 500 13px var(--mono); position: relative; }
.row .main { min-width: 0; }
.row .rs { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.3; }
.row .rm { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.below .sc b { color: var(--ink-3); }
.row.below .sc i { background: var(--ink-3); }
.vi { display: inline-flex; width: 18px; justify-content: center; }
.vi.confirmed { color: var(--crit); } .vi.watch { color: var(--warn); } .vi.benign { color: var(--ink-3); }
.vi.gtA { color: var(--s1); font: 600 10px var(--mono); }
.more { display: block; width: 100%; padding: 10px; background: none; border: 0; color: var(--accent-2); font-weight: 500; }

/* ---------- selected session ---------- */
.sid { font-size: 13px; word-break: break-all; }
.idrow { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
.meter { display: flex; align-items: center; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
.meter .track { position: relative; flex: 1 1 200px; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line-2); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.meter .thr { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.meter .read { font-size: 13px; color: var(--ink-2); }
.meter .read b { font: 600 18px var(--display); color: var(--ink); margin-right: 4px; }
.vb { display: flex; gap: 8px; flex-wrap: wrap; }
.vbtn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }
.vbtn svg { width: 15px; height: 15px; }
.vbtn kbd { font: 500 10.5px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-3); background: var(--panel-2); }
.vbtn:hover { background: var(--panel-2); }
.vbtn.confirmed svg { color: var(--crit); } .vbtn.watch svg { color: var(--warn); } .vbtn.benign svg { color: var(--ink-3); }
.vbtn[aria-pressed="true"].confirmed { background: var(--crit); border-color: var(--crit); color: var(--on-fill); }
.vbtn[aria-pressed="true"].confirmed svg { color: var(--on-fill); }
.vbtn[aria-pressed="true"].watch { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
.vbtn[aria-pressed="true"].watch svg { color: var(--on-warn); }
.vbtn[aria-pressed="true"].benign { background: var(--ink-2); border-color: var(--ink-2); color: var(--bg); }
.vbtn[aria-pressed="true"].benign svg { color: var(--bg); }
.vbtn:disabled { opacity: .5; cursor: not-allowed; }
.note { width: 100%; margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
.saved { font-size: 12px; color: var(--ink-3); margin-top: 6px; min-height: 17px; }
.apply { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.apply button.go { background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 6px 12px; font-weight: 600; }
.why-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.why-list li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.why-list .k { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding-top: 2px; }
.why-list .t { font-size: 13.5px; }
.why-list .rbar { grid-column: 2; display: block; height: 3px; background: var(--line-2); border-radius: 2px; }
.why-list .rbar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.bul { display: grid; gap: 7px; margin-top: 14px; }
.bul .r { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(70px, 1fr) 74px; gap: 10px; align-items: center; font-size: 12.5px; }
.bul .r .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bul .tr { position: relative; height: 10px; background: var(--panel-2); border-radius: 2px; }
.bul .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 3px 3px 0; min-width: 2px; }
.bul .tr u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); text-decoration: none; }
.bul .v { font: 500 11.5px var(--mono); color: var(--ink-2); text-align: right; white-space: nowrap; }
.bul .r.diff .n { font-weight: 600; }
.key { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink-3); margin-top: 8px; flex-wrap: wrap; }
.key i { display: inline-block; width: 10px; height: 10px; background: var(--accent); border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.key u { display: inline-block; width: 2px; height: 11px; background: var(--ink); margin-right: 5px; vertical-align: -2px; }

/* map */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mapbox { position: relative; }
#map { display: block; width: 100%; height: 330px; touch-action: manipulation; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-3); padding: 8px 14px 12px; }
.leg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.leg i.ring { background: none; border: 2px solid var(--ink); }

/* sequence */
.tw { overflow: auto; max-height: 360px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 7px 12px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; }
td { padding: 6px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 13px; }
tr.ev { cursor: pointer; } tr.ev:hover td { background: var(--panel-2); }
tr.ev.oov td { background: color-mix(in srgb, var(--crit) 10%, transparent); }
td.t, td.i { font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
td.h { font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; }
tr.raw td { font: 12px/1.5 var(--mono); color: var(--ink-2); background: var(--panel-2); word-break: break-all; }
.tag { font: 600 10px var(--mono); letter-spacing: .04em; padding: 1px 5px; border-radius: 4px; background: var(--crit); color: var(--on-fill); margin-right: 6px; vertical-align: 1px; }
.simlist { display: grid; gap: 0; }
.simlist button { display: grid; grid-template-columns: 54px minmax(0, 1fr) 20px; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: 7px 14px; }
.simlist button:hover { background: var(--panel-2); }

/* tables in other tabs */
.tblp { overflow-x: auto; }
.tblp td, .tblp th { white-space: nowrap; }
.tblp td.wrap { white-space: normal; min-width: 260px; }
.tblp tr.click { cursor: pointer; } .tblp tr.click:hover td { background: var(--panel-2); }
.shbar { display: inline-block; height: 8px; border-radius: 2px; background: var(--accent); vertical-align: middle; min-width: 2px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); }
.pill.ok { color: var(--accent-2); background: var(--accent-soft); border-color: transparent; }
.pill.bad { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); border-color: transparent; }
.intro { max-width: 78ch; color: var(--ink-2); margin: 0 0 14px; }

/* evaluation */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
.card .big { font: 700 28px/1.1 var(--display); letter-spacing: -.01em; margin: 6px 0 4px; }
.card .sub { font-size: 12.5px; color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }
.cap { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0; max-width: 70ch; }
svg.ch { display: block; width: 100%; height: auto; overflow: visible; }
svg.ch text { font: 11px var(--ui); fill: var(--ink-3); }
svg.ch .grid { stroke: var(--line-2); stroke-width: 1; }
svg.ch .axis { stroke: var(--line); stroke-width: 1; }
.cmp { display: grid; gap: 9px; }
.cmp .r { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(0, 2fr) 46px; gap: 10px; align-items: center; font-size: 12.5px; }
.cmp .tr { position: relative; height: 14px; }
.cmp .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink-3); opacity: .55; border-radius: 0 4px 4px 0; }
.cmp .tr i.me { background: var(--accent); opacity: 1; }
.cmp .tr s { position: absolute; top: 6px; height: 2px; background: var(--ink); text-decoration: none; }
.cmp .tr s::before, .cmp .tr s::after { content: ""; position: absolute; top: -4px; width: 2px; height: 10px; background: var(--ink); }
.cmp .tr s::before { left: 0; } .cmp .tr s::after { right: 0; }
.cmp .v { font: 500 12px var(--mono); text-align: right; }
.stk { display: flex; gap: 2px; height: 30px; }
.stk div { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; border-radius: 3px; color: var(--on-fill); }
.stk div.c1 { background: var(--s1); } .stk div.c2 { background: var(--s2); }
.stk div.c3 { background: var(--s3); color: var(--on-s3); } .stk div.c4 { background: var(--s4); color: var(--on-s4); }
.stk div.n1 { background: var(--accent); } .stk div.n2 { background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.stkl { font-size: 12px; color: var(--ink-2); margin: 10px 0 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.heat { display: grid; grid-template-columns: 62px repeat(4, minmax(0, 1fr)); gap: 3px; font-size: 12px; }
.heat div { padding: 8px 4px; text-align: center; border-radius: 4px; font: 500 12px var(--mono); }
.heat .h { font: 600 11px var(--ui); color: var(--ink-3); background: none; }
.heat .c { cursor: default; }
.heat .c.pick { outline: 2px solid var(--ink); outline-offset: 1px; }
.pipe { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.pipe div { flex: 1 1 130px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); min-width: 0; }
.pipe b { display: block; font-size: 12.5px; }
.pipe span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.finds { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.finds .panel .body p { margin: 0 0 8px; color: var(--ink-2); }
.finds h3 { font: 600 14.5px/1.25 var(--display); margin-bottom: 6px; }
details { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
details summary { cursor: pointer; color: var(--accent-2); }
.mini td, .mini th { padding: 4px 10px; font-size: 12.5px; }
.mini th { position: static; }

<script>
(function () {
'use strict';
/* ====================================================================== data */
const D = JSON.parse(document.getElementById('data').textContent);
const H = D.hunt, NH = H.length, M = D.meta, MAP = D.map, OFF = D.hunt_offset, EV = D.eval || null;
const TPL = new Map(D.templates.map(t => [t.id, t]));
const EXC = new Set(D.templates.filter(t => /xception/i.test(t.text)).map(t => t.id));
const CL = D.clusters;
const order = Array.from({ length: NH }, (_, i) => i).sort((a, b) => H[b].s - H[a].s);
const rank = new Int32Array(NH); order.forEach((i, r) => { rank[i] = r; });
const SMAX = Math.max.apply(null, H.map(h => h.s));
const defaultN = H.filter(h => h.s >= M.threshold).length;
const hasGT = H.length > 0 && H[0].y !== null && H[0].y !== undefined;
const gtTotal = H.reduce((a, h) => a + (h.y ? 1 : 0), 0);
H.forEach(h => { h._q = (h.id + ' ' + h.why.map(w => w[1]).join(' ') + ' ' + h.m.join(' ')).toLowerCase(); });

/* ====================================================================== helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fT = t => new Date(t * 1000).toISOString().slice(11, 19);
const fN = n => Number(n).toLocaleString('en-US');
const pc = (x, d) => (x * 100).toFixed(d || 0) + '%';
const f2 = x => Number(x).toFixed(2);
const tshort = id => (TPL.get(id) || { short: '?' }).short;
const sess = i => H[i];
function tryStore(fn) { try { return fn(); } catch (e) { return null; } }

const KIND = { count: 'Event count', shape: 'Lifecycle shape', oov: 'Unseen event', transition: 'Event order' };
const IC = {
  confirmed: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.2v4.6M8 11v1" stroke="var(--on-fill)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  watch: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/></svg>',
  benign: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.2l2.2 2.2L11.2 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const VLAB = { confirmed: 'Confirm anomaly', watch: 'Watch', benign: 'Benign' };
const VDONE = { confirmed: 'Confirmed', watch: 'Watch', benign: 'Benign' };
const VKEY = { confirmed: 'C', watch: 'W', benign: 'B' };

const LENSES = {
  all: { label: 'Every session in the queue', f: () => true },
  oov: { label: 'Unseen event shape', f: h => h.e.indexOf(-1) >= 0 },
  exc: { label: 'Exception events', f: h => h.e.some(t => EXC.has(t)) },
  short: { label: 'Incomplete lifecycle (6 events or fewer)', f: h => h.n <= 6 },
  long: { label: 'Long lifecycle (more than 30 events)', f: h => h.n > 30 },
  slow: { label: 'Slow lifecycle (over 5 minutes)', f: h => h.d > 300 },
  order: { label: 'Event order is the only reason', f: h => h.why.length > 0 && h.why.every(w => w[0] === 'transition') }
};

/* ====================================================================== state */
const S = { tab: 'triage', N: defaultN, sel: order[0], reveal: false, vf: 'open', lens: 'all', cl: 'any', host: -1, q: '',
            below: false, map: 'map', verdicts: {}, shown: 150, openEv: new Set(), dismissed: {}, evAll: false };
let db = null, userNs = null, dlNs = null, myId = null, canWrite = true, storeState = 'memory';

/* ====================================================================== persistence (shared triage verdicts) */
async function initCaps() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    db = await c.use('db'); userNs = await c.use('user'); dlNs = await c.use('downloads');
    if (userNs) { try { myId = await userNs.id(); } catch (e) {} try { const w = await userNs.can('data.write'); if (w === false) canWrite = false; } catch (e) {} }
    if (db) {
      storeState = canWrite ? 'shared' : 'readonly';
      db.collection('triage').onSnapshot(snap => {
        const nv = {}; snap.docs.forEach(d => { const x = d.data(); if (x && x.v) nv[d.id] = x; });
        S.verdicts = nv; schedule();
      }, err => { storeState = 'memory'; schedule(); });
    }
  } catch (e) { db = null; storeState = 'memory'; }
  schedule();
}
async function setVerdict(i, v, quiet) {
  const h = H[i]; const cur = S.verdicts[h.id] || {};
  if (db && !canWrite) { toast('Your access level is view-only, so verdicts cannot be saved.'); return false; }
  if (v === null) delete S.verdicts[h.id];
  else S.verdicts[h.id] = { v, note: cur.note || '', by: myId, at: new Date().toISOString(), score: h.s };
  if (db) {
    try {
      const ref = db.doc('triage/' + h.id);
      if (v === null) await ref.delete(); else await ref.set(S.verdicts[h.id]);
    } catch (e) { if (!quiet) toast('Could not save to the shared store (' + (e.code || 'error') + '). Kept in this tab only.'); }
  }
  return true;
}
async function setNote(i, text) {
  const h = H[i]; const cur = S.verdicts[h.id]; if (!cur) return;
  cur.note = text;
  if (db && canWrite) { try { await db.doc('triage/' + h.id).update({ note: text }); } catch (e) { toast('Could not save the note.'); } }
}

/* ====================================================================== derived */
const isFl = i => rank[i] < S.N;
function queueList() {
  return order.filter(i => {
    const h = H[i];
    if (!S.below && rank[i] >= S.N) return false;
    const v = S.verdicts[h.id] && S.verdicts[h.id].v;
    if (S.vf === 'open' && v) return false;
    if (S.vf !== 'open' && S.vf !== 'all' && v !== S.vf) return false;
    if (!LENSES[S.lens].f(h)) return false;
    if (S.cl !== 'any' && h.c !== +S.cl) return false;
    if (S.host >= 0 && h.h.indexOf(S.host) < 0) return false;
    if (S.q && h._q.indexOf(S.q) < 0) return false;
    return true;
  });
}
function counts() {
  const c = { confirmed: 0, watch: 0, benign: 0 };
  for (const k in S.verdicts) { const v = S.verdicts[k].v; if (c[v] !== undefined) c[v]++; }
  return c;
}

/* ====================================================================== render: strip */
function renderStrip() {
  const sp = M.split.test;
  $('#win').innerHTML = 'Hunt window <b class="num">' + fT(sp[0]) + '–' + fT(sp[1]) + '</b> on 9 Nov 2008 · <b class="num">' + fN(NH) +
    '</b> sessions<br><span class="muted">Clusters and threshold were learned from the ' + fN(M.split.train[2]) + ' sessions that started earlier, without labels.</span>';
  const r = $('#rngN'); r.max = Math.max(300, defaultN * 2); r.value = S.N;
  $('#tickModel').style.left = (defaultN - 10) / (r.max - 10) * 100 + '%'; $('#tickModel').textContent = 'model ' + defaultN;
  const thr = order[Math.min(S.N, NH) - 1] !== undefined ? H[order[Math.min(S.N, NH) - 1]].s : 0;
  $('#outN').innerHTML = '<b class="num">' + S.N + '</b> sessions <span class="muted num">(' + pc(S.N / NH, 1) + ' · score ≥ ' + f2(thr) + ')</span>';
  $('#revealWrap').style.display = hasGT ? '' : 'none';
  const lv = $('#live');
  if (hasGT && S.reveal) {
    const found = order.slice(0, S.N).reduce((a, i) => a + (H[i].y ? 1 : 0), 0);
    lv.innerHTML = 'Benchmark: <b class="num">' + found + '</b> of <b class="num">' + gtTotal + '</b> anomalies found · precision <b class="num">' + pc(found / S.N) + '</b> · recall <b class="num">' + pc(found / gtTotal) + '</b>';
  } else lv.innerHTML = '<span class="muted">Labels hidden: hunt blind, then check yourself.</span>';
  const c = counts();
  const st = { shared: 'Verdicts shared with this page’s viewers', readonly: 'View only: verdicts are not saved', memory: 'Verdicts kept in this tab only' }[storeState];
  $('#vsum').innerHTML = ['confirmed', 'watch', 'benign'].map(k => '<span class="it vi ' + k + '" style="width:auto">' + IC[k] + '<span style="color:var(--ink-2)"><b class="num">' + c[k] + '</b> ' + VDONE[k].toLowerCase() + '</span></span>').join('') +
    '<span class="muted" title="' + esc(st) + '">' + esc(st) + '</span>';
}

/* ====================================================================== render: queue */
function renderFilters() {
  const fc = $('#fC'); if (!fc.options.length) {
    fc.innerHTML = '<option value="any">Any behaviour mode</option>' + CL.map(c => '<option value="' + c.id + '">Mode ' + c.id + (c.normal ? '' : ' (distrusted)') + ' · ' + c.n_hunt + ' here</option>').join('');
    $('#fL').innerHTML = '';
  }
  const fl = order.slice(0, S.N);
  $('#fL').innerHTML = Object.keys(LENSES).map(k => '<option value="' + k + '">Lens: ' + LENSES[k].label + (k === 'all' ? '' : ' (' + fl.filter(i => LENSES[k].f(H[i])).length + ')') + '</option>').join('');
  $('#fL').value = S.lens; $('#fV').value = S.vf; $('#fC').value = S.cl; $('#fB').checked = S.below;
}
function renderQueue() {
  const list = queueList();
  $('#qcount').textContent = fN(list.length) + ' shown';
  const chips = [];
  if (S.host >= 0) chips.push('<span class="chip">Host ' + esc(D.hosts[S.host]) + ' <button data-clr="host" aria-label="Clear host filter">×</button></span>');
  $('#chips').innerHTML = chips.join('');
  $('#chips').style.display = chips.length ? '' : 'none';
  const shown = list.slice(0, S.shown);
  if (!list.length) { $('#qlist').innerHTML = '<p class="empty">Nothing matches. ' + (S.vf === 'open' ? 'Every session in this budget has a verdict, or the filters are too narrow.' : 'Loosen a filter.') + '</p>'; return; }
  $('#qlist').innerHTML = shown.map(i => {
    const h = H[i], v = S.verdicts[h.id], reason = h.why.length ? h.why[0][1] : 'Close to a normal mode';
    const gt = S.reveal && hasGT ? (h.y ? '<span class="vi gtA" title="Benchmark label: anomaly">GT</span>' : '') : '';
    const w = Math.max(3, Math.min(1, h.s / SMAX) * 100);
    return '<button class="row' + (isFl(i) ? '' : ' below') + '" data-i="' + i + '" aria-selected="' + (i === S.sel) + '">' +
      '<span class="rk">#' + (rank[i] + 1) + '</span>' +
      '<span class="sc"><i style="width:' + w + '%"></i><b class="num">' + f2(h.s) + '</b></span>' +
      '<span class="main"><span class="rs">' + esc(reason) + '</span><span class="rm">' + fT(h.t) + ' · ' + h.n + ' events · ' + h.d + ' s · mode ' + h.nm + '</span></span>' +
      '<span class="vi ' + (v ? v.v : '') + '">' + (v ? IC[v.v] : gt) + '</span></button>';
  }).join('') + (list.length > shown.length ? '<button class="more" data-more>Show ' + Math.min(150, list.length - shown.length) + ' more</button>' : '');
}

/* ====================================================================== render: selected session */
function renderDetail() {
  if (document.activeElement && document.activeElement.id === 'note') return;
  const i = S.sel, h = H[i], v = S.verdicts[h.id];
  const cl = CL[h.nm], over = h.s >= (H[order[Math.min(S.N, NH) - 1]] || { s: 0 }).s;
  const thrS = H[order[Math.min(S.N, NH) - 1]].s;
  let head = '<div class="body"><div class="idrow"><code class="sid" title="Session (HDFS block) id">' + esc(h.id) + '</code>' +
    '<button class="ghost sm" data-copy>Copy id</button>' +
    '<span class="muted num">' + fT(h.t) + ' · ' + h.n + ' events · ' + h.d + ' s</span>' +
    '<span class="chip">Nearest normal mode ' + h.nm + '</span>' +
    (S.reveal && hasGT ? '<span class="chip ' + (h.y ? 'crit' : '') + '">Benchmark label: ' + (h.y ? 'anomaly' : 'normal') + '</span>' : '') + '</div>';
  head += '<div class="meter"><div class="track" title="Score = log(1 + distance to nearest normal mode ÷ typical spread)"><div class="fill" style="width:' + Math.min(100, h.s / SMAX * 100) + '%"></div><div class="thr" style="left:' + Math.min(100, thrS / SMAX * 100) + '%" title="Review budget cut-off"></div></div>' +
    '<div class="read"><b class="num">' + f2(h.s) + '</b>score · rank <span class="num">#' + (rank[i] + 1) + '</span> of ' + fN(NH) + ' · ' + (isFl(i) ? 'inside' : 'outside') + ' the review budget</div></div>';
  head += '<div class="vb" role="group" aria-label="Verdict">' + ['confirmed', 'watch', 'benign'].map(k =>
    '<button class="vbtn ' + k + '" data-v="' + k + '" aria-pressed="' + (!!v && v.v === k) + '"' + (db && !canWrite ? ' disabled' : '') + '>' + IC[k] + VLAB[k] + ' <kbd>' + VKEY[k] + '</kbd></button>').join('') +
    (v ? '<button class="ghost" data-v="clear">Clear</button>' : '') + '</div>';
  head += '<input id="note" class="note" type="text" maxlength="300" placeholder="Note for the next analyst (saved with the verdict)" value="' + esc(v ? v.note || '' : '') + '"' + (v ? '' : ' disabled') + ' aria-label="Note">';
  head += '<div class="saved" id="savedBy"></div>';
  const sim = (D.nn[i] || []);
  const openSim = v ? sim.filter(j => !S.verdicts[H[j].id]) : [];
  if (v && openSim.length && !S.dismissed[h.id]) {
    head += '<div class="apply"><span><b class="num">' + openSim.length + '</b> near-identical sessions in this window still have no verdict. Mark them <b>' + VDONE[v.v].toLowerCase() + '</b> too?</span>' +
      '<button class="go" data-apply>Apply to ' + openSim.length + '</button><button class="ghost" data-dismiss>Not now</button></div>';
  }
  head += '</div>';
  $('#dHead').innerHTML = head;
  if (v && v.by) { resolveBy(v); } else if (v) $('#savedBy').textContent = 'Verdict ' + new Date(v.at).toLocaleString();

  /* why */
  let w = '<header><h2>Why it was flagged</h2></header><div class="body">';
  if (h.why.length) {
    w += '<ul class="why-list">' + h.why.map(r => '<li><span class="k">' + KIND[r[0]] + '</span><span class="t">' + esc(r[1]) + '</span><span class="rbar"><i style="width:' + Math.round(r[2] * 100) + '%"></i></span></li>').join('') + '</ul>' +
      '<p class="cap">Bars show each reason’s share of the distance from mode ' + h.nm + '.</p>';
  } else w += '<p class="muted" style="margin:0">This session sits close to normal mode ' + h.nm + '.</p>';
  const rows = [];
  const obs = {}; h.e.forEach(t => { obs[t] = (obs[t] || 0) + 1; });
  const ids = new Set(Object.keys(obs).map(Number)); Object.keys(cl.typ).forEach(k => ids.add(+k));
  ids.forEach(t => { const o = obs[t] || 0, ty = cl.typ[t] || 0; rows.push({ t, o, ty, d: Math.abs(o - ty) }); });
  rows.sort((a, b) => b.d - a.d || b.o - a.o);
  const mx = Math.max(3, ...rows.map(r => Math.max(r.o, r.ty)));
  w += '<div class="lbl" style="margin-top:16px">Events here vs. mode ' + h.nm + '</div><div class="bul">' + rows.slice(0, 9).map(r =>
    '<div class="r' + (r.d ? ' diff' : '') + '"><span class="n" title="' + esc((TPL.get(r.t) || {}).text || '') + '">' + esc(tshort(r.t)) + '</span><span class="tr"><i style="width:' + r.o / mx * 100 + '%"></i><u style="left:calc(' + r.ty / mx * 100 + '% - 1px)"></u></span><span class="v">' + r.o + ' vs ' + r.ty + '</span></div>').join('') + '</div>' +
    '<div class="key"><span><i></i>this session</span><span><u></u>typical for the mode</span></div>' +
    '<p class="cap">Mode ' + h.nm + ' is typically ' + cl.typ_events.toFixed(0) + ' events over ' + cl.typ_duration.toFixed(0) + ' s.</p></div>';
  $('#dWhy').innerHTML = w;

  /* sequence */
  const LIM = S.evAll ? 1000 : 80;
  let q = '<header><h2>Event sequence</h2><span class="muted num">' + h.n + ' events over ' + h.d + ' s</span></header><div class="tw"><table><thead><tr><th>#</th><th>+s</th><th>Event</th><th>Host</th></tr></thead><tbody>';
  for (let j = 0; j < Math.min(h.n, LIM); j++) {
    const t = h.e[j], oov = t < 0, key = i + ':' + j, open = S.openEv.has(key);

    (grep ? ' A one-line grep for “exception” has precision ' + pc(cmp[grep].precision) + ' but recall ' + pc(cmp[grep].recall) + '.' : '') + '</p></div></section>' +
    '<section class="panel"><header><h2>Why 40 anomalies were never flagged</h2></header><div class="body">' +
    '<div class="stkl">Test anomalies (' + P.n_anomalies + ')</div><div class="stk"><div class="n1" style="flex:' + (ce.caught_with_different_counts + ce.missed_with_different_counts) + '">' + (ce.caught_with_different_counts + ce.missed_with_different_counts) + ' differ from routine event counts → ' + ce.caught_with_different_counts + ' flagged</div><div class="n2" style="flex:' + ce.same_event_counts_as_routine + '">' + ce.same_event_counts_as_routine + ' identical counts → 0</div></div>' +
    '<p class="cap" id="missNote"></p></div></section></div>';
  const rm = EV.reason_mix, kinds = ['count', 'shape', 'transition', 'oov'], kc = { count: 'c1', shape: 'c2', transition: 'c3', oov: 'c4' };
  const stack = o => { const tot = kinds.reduce((a, k) => a + (o[k] || 0), 0) || 1; return '<div class="stk">' + kinds.filter(k => o[k]).map(k => '<div class="' + kc[k] + '" style="flex:' + o[k] + '" title="' + KIND[k] + ': ' + o[k] + '">' + (o[k] / tot > .1 ? KIND[k] + ' ' + o[k] : '') + '</div>').join('') + '</div>'; };
  h += '<div class="grid2"><section class="panel"><header><h2>What triggers true alerts and false alarms</h2></header><div class="body"><div class="stkl">True anomalies flagged (' + P.tp + ')</div>' + stack(rm.TP) + '<div class="stkl">False alarms (' + P.fp + ')</div>' + stack(rm.FP) +
    '<div class="legend">' + kinds.map(k => '<span><i style="background:var(--' + { count: 's1', shape: 's2', transition: 's3', oov: 's4' }[k] + ')"></i>' + KIND[k] + '</span>').join('') + '</div>' +
    '<p class="cap">Counts of the top reasons the explainer gave for each flagged test session. Most false alarms are fast lifecycles (median 2 s) whose events arrive in an order not seen in training; the log’s one-second timestamps leave many events tied. “Apply to similar” clears them in bulk.</p></div></section>' +
    '<section class="panel"><header><h2>Sensitivity to the cluster-mass cut-off</h2></header><div class="body" id="heat"></div></section></div>';
  const post = m.test.posthoc_transition_weight;
  h += '<div class="finds"><section class="panel"><header><h2>The review budget matters more than the threshold</h2></header><div class="body"><p>Ranking quality barely moves when the transition features are re-weighted (PR-AUC ' + Object.keys(post).map(k => f2(post[k].pr_auc)).join(', ') + '), but the share of sessions the model’s own threshold would flag swings from ' + pc(post['w_transition=0.6'].alert_rate_at_envelope_threshold, 1) + ' to ' + pc(post['w_transition=0.0'].alert_rate_at_envelope_threshold, 1) + '.</p><p class="muted" style="margin:0">That check was run after looking at test errors, so read it as a diagnosis, not a tuned result. It is why the queue is driven by a budget slider and the learned threshold is only the starting point.</p></div></section>' +
    '<section class="panel"><header><h2>Ablation on the validation slice</h2></header><div class="body"><table class="mini"><thead><tr><th>Feature blocks</th><th>PR-AUC</th><th>ROC-AUC</th></tr></thead><tbody>' + Object.keys(m.val.ablation).map(k => '<tr><td>' + esc(k) + '</td><td class="num">' + f2(m.val.ablation[k].pr_auc) + '</td><td class="num">' + f2(m.val.ablation[k].roc_auc) + '</td></tr>').join('') + '</tbody></table><p class="cap">Event counts do most of the work on this log. Timing adds a little; transitions add almost nothing here.</p></div></section>' +
    '<section class="panel"><header><h2>Scope and limits</h2></header><div class="body"><p>One 100,000-line sample of HDFS logs from a single 26-minute run, with block-level labels from the benchmark authors’ rules. Failures in a distributed file system stand in for security anomalies; this has not been tested on attack data.</p><p style="margin:0">Several labelled anomalies depend on events outside the sample, which no unsupervised model can recover.</p></div></section></div>';
  h += '<section class="panel" style="margin-bottom:16px"><header><h2>Pipeline</h2></header><div class="body"><div class="pipe">' +
    [['Ingest', fN(M.n_lines) + ' log lines', M.timings.ingest], ['Template mining', M.n_templates + ' event templates (train only)', M.timings.template_mining], ['Sessionize', fN(M.n_sessions) + ' block lifecycles', M.timings.sessionize],
     ['Features', M.n_features + ' dimensions: counts, transitions, timing', null], ['Cluster', 'k = ' + M.k + ', ' + M.n_normal_modes + ' normal modes', M.timings.features_and_clustering], ['Score + explain', 'distance to nearest normal mode', M.timings.explanations]]
      .map(s => '<div><b>' + s[0] + '</b><span>' + esc(s[1]) + '</span>' + (s[2] !== null ? '<span class="num">' + s[2] + ' s</span>' : '') + '</div>').join('') + '</div>' +
    '<p class="cap">Data: HDFS_100k from the <a href="https://github.com/logpai/loglizer" target="_blank" rel="noopener">loglizer</a> repository, derived from the Xu et al. (SOSP 2009) dataset in <a href="https://github.com/logpai/loghub" target="_blank" rel="noopener">LogHub</a>. Chronological split: 60% train, 15% validation, 25% test.</p></div></section>';
  el.innerHTML = h;
  const gains = EV.gains.filter((p, k) => p[0] <= .3 && (k % 2 === 0 || p[0] < .06));
  curve('#cGain', { label: 'Share of anomalies found against share of sessions reviewed', pts: gains, xmax: .3, ymax: 1, xt: [0, .05, .1, .15, .2, .25, .3], yt: [0, .25, .5, .75, 1], xl: 'Share of hunt window reviewed', yl: 'Anomalies found', diag: true,
    marks: [top(.01), top(.03), top(.05), top(.1)].map((b, k) => ({ x: b.budget, y: b.recall, t: 'top ' + pc(b.budget), dx: k === 0 ? 8 : 6, dy: k === 0 ? 16 : 16 })),
    refs: [{ y: (ce.caught_with_different_counts + ce.missed_with_different_counts) / P.n_anomalies, t: 'ceiling: anomalies that differ from routine event counts' }],
    tip: p => '<b>Reviewing ' + pc(p[0], 1) + '</b><br><span>finds ' + pc(p[1]) + ' of anomalies</span>' });
  const pr = EV.pr_curve.slice().sort((a, b) => a[0] - b[0]);
  curve('#cPR', { label: 'Precision against recall', pts: pr, xmax: 1, ymax: 1, xt: [0, .25, .5, .75, 1], yt: [0, .25, .5, .75, 1], xl: 'Recall', yl: 'Precision',
    marks: [{ x: P.recall, y: P.precision, t: 'model threshold', dx: -8, dy: -10 }], refs: [{ y: EV.prevalence, t: 'base rate ' + pc(EV.prevalence, 1) }],
    tip: p => '<b>Recall ' + pc(p[0]) + '</b><br><span>precision ' + pc(p[1]) + '</span>' });
  /* heat */
  const g = m.val.sensitivity_pr_auc, ks = [10, 20, 30, 50], ts = [0.005, 0.01, 0.02, 0.05]; let hh = '<div class="heat"><div class="h"></div>' + ts.map(t => '<div class="h">' + pc(t, 1) + '</div>').join('');
  ks.forEach(k => { hh += '<div class="h" style="text-align:right;padding-right:8px">k = ' + k + '</div>'; ts.forEach(t => { const v = g['k=' + k + '|tau=' + t]; const a = Math.round(10 + Math.min(1, v / .7) * 80); hh += '<div class="c' + (k === M.k && t === M.min_share ? ' pick' : '') + '" style="background:color-mix(in srgb, var(--accent) ' + a + '%, var(--panel));color:' + (a > 52 ? '#fff' : 'var(--ink)') + '" title="k=' + k + ', cut-off ' + pc(t, 1) + ': PR-AUC ' + f2(v) + '">' + f2(v) + '</div>'; }); });
  $('#heat').innerHTML = hh + '</div><p class="cap">Validation PR-AUC by number of clusters (rows) and minimum share of training traffic for a normal mode (columns). Outlined cell is the default. Below 1% the cut-off lets a 28-session anomaly pattern in the training data count as normal and the score collapses, so the cut-off must exceed the traffic share of any single anomaly pattern.</p>';
  if (hasGT) {
    const miss = H.filter((h2, i) => h2.y && !isFl(i) ? false : false);
    const cnt = {}; let missed = 0; H.forEach((h2, i) => { if (h2.y && h2.s < M.threshold) { missed++; new Set(h2.h.filter(x => x >= 0)).forEach(x => { cnt[x] = (cnt[x] || 0) + 1; }); } });
    const top1 = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    if (top1 !== undefined) $('#missNote').innerHTML = 'Their labels depend on events outside this log sample, so they look routine inside it. One host stands out: <span class="mono">' + esc(D.hosts[top1]) + '</span> appears in ' + cnt[top1] + ' of the ' + missed + ' unflagged anomalies. Turn on benchmark labels and open the Hosts view to see it.';
  }
}

/* ====================================================================== orchestration */
let raf = 0;
function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; renderAll(); }); }
function renderAll() {
  renderStrip();
  if (S.tab === 'triage') { renderFilters(); renderQueue(); renderDetail(); renderMapMeta(); drawMap(); }
  else if (S.tab === 'hosts') renderHosts();
}
function setTab(t, push) {
  S.tab = t;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['triage', 'clusters', 'hosts', 'evaluation'].forEach(k => { $('#v-' + k).hidden = k !== t; });
  if (t === 'clusters') renderClusters(); if (t === 'evaluation') renderEval(); if (t === 'hosts') renderHosts();
  if (push) tryStore(() => history.replaceState(null, '', '#' + t));
  renderAll(); if (t === 'triage') requestAnimationFrame(drawMap);
  window.scrollTo(0, 0);
}
function select(i, scroll) {
  S.sel = i; renderDetail(); renderQueue(); drawMap();
  if (scroll !== false) { const r = $('.row[data-i="' + i + '"]'); if (r) r.scrollIntoView({ block: 'nearest' }); }
}
async function verdict(v) {
  const i = S.sel, h = H[i], cur = S.verdicts[h.id];
  if (v === 'clear' || (cur && cur.v === v)) { const ok = await setVerdict(i, null); if (ok) { delete S.dismissed[h.id]; schedule(); } return; }
  const list = queueList(), pos = list.indexOf(i);
  const ok = await setVerdict(i, v); if (!ok) return;
  schedule();
  if (S.vf === 'open' && pos >= 0) { const nxt = list.slice(pos + 1).concat(list.slice(0, pos)).find(j => !S.verdicts[H[j].id]); if (nxt !== undefined && !(D.nn[i] || []).length) select(nxt); else if (nxt !== undefined && !(D.nn[i] || []).some(j => !S.verdicts[H[j].id])) select(nxt); }
}
async function applySimilar() {
  const i = S.sel, h = H[i], v = S.verdicts[h.id]; if (!v) return;
  const todo = (D.nn[i] || []).filter(j => !S.verdicts[H[j].id]); if (db && !canWrite) { toast('View-only access: verdicts cannot be saved.'); return; }
  for (const j of todo) { await setVerdict(j, v.v, true); }
  toast('Marked ' + todo.length + ' similar sessions ' + VDONE[v.v].toLowerCase() + '.'); schedule();
}
function csv() {
  const rows = [['session_id', 'verdict', 'note', 'score', 'rank', 'start_time_utc', 'events', 'duration_s', 'top_reason', 'marked_at']];
  Object.keys(S.verdicts).forEach(id => { const i = H.findIndex(h => h.id === id); if (i < 0) return; const v = S.verdicts[id], h = H[i];
    rows.push([id, v.v, v.note || '', h.s, rank[i] + 1, new Date(h.t * 1000).toISOString(), h.n, h.d, h.why[0] ? h.why[0][1] : '', v.at || '']); });
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}
function openExport() {
  const n = Object.keys(S.verdicts).length, box = $('#exp'); box.hidden = false;
  box.innerHTML = '<div class="exp" role="dialog" aria-modal="true" aria-label="Export verdicts"><div><h2>Export verdicts (' + n + ')</h2><textarea id="csvOut" readonly></textarea><div class="act"><button class="ghost" data-x="close">Close</button><button class="ghost" data-x="copy">Copy CSV</button>' + (dlNs ? '<button class="go" data-x="save">Save as file</button>' : '') + '</div></div></div>';
  $('#csvOut').value = n ? csv() : 'No verdicts yet. Confirm, watch or clear sessions in the queue and they will appear here.';
}

/* ====================================================================== events */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, tr, [data-i]'); if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab, true);
  if (t.dataset.i !== undefined && (t.closest('#qlist') || t.closest('#dSim'))) return select(+t.dataset.i, !t.closest('#dSim'));
  if (t.dataset.more !== undefined) { S.shown += 150; return renderQueue(); }
  if (t.dataset.clr === 'host') { S.host = -1; return schedule(); }
  if (t.dataset.map) { S.map = t.dataset.map; renderMapMeta(); return drawMap(); }
  if (t.dataset.v) return verdict(t.dataset.v);
  if (t.dataset.apply !== undefined) return applySimilar();
  if (t.dataset.dismiss !== undefined) { S.dismissed[H[S.sel].id] = 1; return renderDetail(); }
  if (t.dataset.copy !== undefined) { try { await navigator.clipboard.writeText(H[S.sel].id); toast('Session id copied.'); } catch (er) { toast('Copy is blocked here. Select the id and copy it by hand.'); } return; }
  if (t.dataset.evall !== undefined) { S.evAll = true; return renderDetail(); }
  if (t.dataset.ev !== undefined) { const key = S.sel + ':' + t.dataset.ev; S.openEv.has(key) ? S.openEv.delete(key) : S.openEv.add(key); return renderDetail(); }
  if (t.dataset.cl !== undefined) { S.cl = t.dataset.cl; S.below = true; S.vf = 'all'; S.lens = 'all'; S.host = -1; setTab('triage', true); const l = queueList(); if (l.length) select(l[0]); return; }
  if (t.dataset.host !== undefined) { S.host = +t.dataset.host; S.below = true; S.vf = 'all'; S.cl = 'any'; setTab('triage', true); const l = queueList(); if (l.length) select(l[0]); return; }
  if (t.id === 'resetN') { S.N = defaultN; return schedule(); }
  if (t.id === 'exportBtn') return openExport();
  if (t.dataset.x) {
    if (t.dataset.x === 'close') { $('#exp').hidden = true; $('#exp').innerHTML = ''; }
    if (t.dataset.x === 'copy') { try { await navigator.clipboard.writeText($('#csvOut').value); toast('Copied.'); } catch (er) { $('#csvOut').select(); toast('Copy is blocked here. The text is selected, copy it manually.'); } }
    if (t.dataset.x === 'save') { try { await dlNs.save({ filename: 'triage-verdicts.csv', data: csv() }); } catch (er) { if (er && er.code !== 'declined') toast('Saving is unavailable here. Use Copy CSV.'); } }
  }
});
$('#rngN').addEventListener('input', e => { S.N = +e.target.value; S.shown = 150; schedule(); });
$('#reveal').addEventListener('change', e => { S.reveal = e.target.checked; schedule(); if (S.tab === 'hosts') renderHosts(); });
$('#fV').addEventListener('change', e => { S.vf = e.target.value; S.shown = 150; schedule(); });
$('#fC').addEventListener('change', e => { S.cl = e.target.value; S.shown = 150; schedule(); });
$('#fL').addEventListener('change', e => { S.lens = e.target.value; S.shown = 150; schedule(); });
$('#fB').addEventListener('change', e => { S.below = e.target.checked; S.shown = 150; schedule(); });
let qT; $('#fQ').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); S.shown = 150; schedule(); }, 180); });
document.addEventListener('change', e => { if (e.target.id === 'note') setNote(S.sel, e.target.value); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey || !$('#exp').hidden && e.key !== 'Escape') { if (e.key === 'Escape' && !$('#exp').hidden) { $('#exp').hidden = true; $('#exp').innerHTML = ''; } return; }
  if (S.tab !== 'triage') return;
  const k = e.key.toLowerCase();
  if (k === 'j' || k === 'k') { const l = queueList(); const p = l.indexOf(S.sel); const n = l[Math.max(0, Math.min(l.length - 1, p + (k === 'j' ? 1 : -1)))]; if (n !== undefined) { e.preventDefault(); select(n); } }
  else if (k === 'c') verdict('confirmed'); else if (k === 'w') verdict('watch'); else if (k === 'b') verdict('benign');
});
new ResizeObserver(() => drawMap()).observe(cv);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => drawMap());
new MutationObserver(() => drawMap()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ====================================================================== boot */
const TABS = ['triage', 'clusters', 'hosts', 'evaluation'];
const h0 = (location.hash || '').slice(1);
setTab(TABS.indexOf(h0) >= 0 ? h0 : 'triage', false);
window.addEventListener('hashchange', () => { const t = (location.hash || '').slice(1); if (TABS.indexOf(t) >= 0 && t !== S.tab) setTab(t, false); });
initCaps();
})();
</script>
